<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Wall -->
  <rect width="800" height="600" fill="url(#wallGrad)"/>
  <!-- Window Sunlight Ray -->
  <polygon points="100,0 350,0 550,600 0,600" fill="#fef3c7" opacity="0.3"/>
  <!-- Minimalist Desk Shelf -->
  <rect x="180" y="160" width="440" height="12" rx="4" fill="#cbd5e1"/>
  <!-- Small Art Frame on Shelf -->
  <rect x="220" y="90" width="70" height="70" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="255" cy="125" r="16" fill="#6366f1" opacity="0.6"/>
  <!-- Desk Surface -->
  <rect x="60" y="380" width="680" height="24" rx="4" fill="url(#deskGrad)"/>
  <!-- Desk Legs -->
  <rect x="120" y="404" width="16" height="196" fill="#334155"/>
  <rect x="664" y="404" width="16" height="196" fill="#334155"/>
  <!-- Monitor Stand -->
  <rect x="385" y="320" width="30" height="60" fill="#94a3b8"/>
  <rect x="350" y="375" width="100" height="6" rx="2" fill="#64748b"/>
  <!-- Monitor Screen -->
  <rect x="240" y="190" width="320" height="190" rx="8" fill="url(#screenGrad)" stroke="#475569" stroke-width="4"/>
  <!-- Code lines on screen -->
  <rect x="270" y="220" width="120" height="8" rx="2" fill="#6366f1"/>
  <rect x="270" y="240" width="180" height="6" rx="2" fill="#38bdf8"/>
  <rect x="290" y="255" width="140" height="6" rx="2" fill="#a855f7"/>
  <rect x="290" y="270" width="200" height="6" rx="2" fill="#10b981"/>
  <rect x="270" y="295" width="90" height="6" rx="2" fill="#f59e0b"/>
  <!-- Ceramic Cup -->
  <rect x="580" y="340" width="34" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 614 348 Q 626 358 614 368" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Potted Plant -->
  <polygon points="170,380 160,330 200,330 190,380" fill="#f97316"/>
  <path d="M 180 330 Q 150 280 180 270 Q 210 280 180 330 Z" fill="url(#plantGrad)"/>
  <path d="M 175 320 Q 130 300 150 280 Q 185 290 175 320 Z" fill="url(#plantGrad)"/>
  <path d="M 185 320 Q 220 300 205 280 Q 175 290 185 320 Z" fill="url(#plantGrad)"/>
</svg>